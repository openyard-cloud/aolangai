<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18">
  <!-- The menu-bar icon: the app icon's bot stack as an 18 pt macOS template image (black on transparent; macOS
       recolours it). scripts/icons.sh renders it at 36 px for TRAY_ICON in src/main/index.ts. -->
  <defs>
    <mask id="cut">
      <rect width="18" height="18" fill="#fff"/>
      <rect x="0" y="4.2" width="15" height="13.8" rx="3" fill="#000"/>
      <rect x="0" y="0" width="9.8" height="5" fill="#000"/>
    </mask>
  </defs>
  <rect x="5.6" y="1.6" width="10.8" height="9" rx="2" fill="none" stroke="#000" stroke-width="1.4" mask="url(#cut)"/>
  <rect x="1.6" y="5.8" width="11.8" height="10.6" rx="2" fill="none" stroke="#000" stroke-width="1.4"/>
  <path d="M7.5 5.8 V4" stroke="#000" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="7.5" cy="2.6" r="1.4" fill="#000"/>
  <rect x="4.6" y="9" width="1.8" height="3.6" rx="0.9" fill="#000"/>
  <rect x="8.6" y="9" width="1.8" height="3.6" rx="0.9" fill="#000"/>
</svg>
